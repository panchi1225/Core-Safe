name: Access control and bulk PDF tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm --prefix functions ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:rules
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run test:functions
      - run: npm run typecheck:functions
      - run: npm run build:functions
      - run: npm run test:functions:emulator
      - run: git diff --check "$BASE_SHA" HEAD
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
